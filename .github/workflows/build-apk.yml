name: Build Jiwu APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate platform scaffold
        run: |
          cd /tmp
          flutter create --project-name jiwu_app --org com.example temp_project
          cp -r /tmp/temp_project/android $GITHUB_WORKSPACE/
          cp /tmp/temp_project/.gitignore $GITHUB_WORKSPACE/ 2>/dev/null || true

      - run: flutter pub get
        working-directory: ${{ github.workspace }}

      - name: Fix Gradle config (compileSdk=36 + disable AarMetadata check)
        run: |
          app_build="$GITHUB_WORKSPACE/android/app/build.gradle.kts"
          # Replace flutter.compileSdkVersion hardcoded value with 36
          sed -i 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' "$app_build"
          # Also replace any other compileSdk references
          sed -i 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdk/compileSdk = 36/' "$app_build"
          # Disable release AAR metadata check (handles dependency version mismatches)
          # Insert before the closing brace of android block
          sed -i '/^android {/a\\n    // Workaround: skip AAR metadata check for file_picker compat\n    checkReleaseAarMetadata = false' "$app_build"
          cat "$app_build" | grep -E 'compileSdk|checkRelease'

      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64
        working-directory: ${{ github.workspace }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ github.workspace }}/build/app/outputs/flutter-apk/*.apk
