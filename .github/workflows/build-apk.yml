name: Build Jiwu APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate platform scaffold
        run: |
          cd /tmp
          flutter create --project-name jiwu_app --org com.example temp_project
          cp -r /tmp/temp_project/android $GITHUB_WORKSPACE/
          cp /tmp/temp_project/.gitignore $GITHUB_WORKSPACE/ 2>/dev/null || true
          # Bump compileSdk to 36 for file_picker compatibility
          find $GITHUB_WORKSPACE/android -name "build.gradle*" -exec sed -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9][0-9]*/compileSdk = 36/g; s/compileSdkVersion[[:space:]]*[0-9][0-9]*/compileSdkVersion 36/g' {} +
          cat $GITHUB_WORKSPACE/android/app/build.gradle* | grep -i compilesdk

      - run: flutter pub get
        working-directory: ${{ github.workspace }}

      - name: Regenerate plugin registrant
        run: |
          rm -f ${{ github.workspace }}/android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.*

      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64
        working-directory: ${{ github.workspace }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ github.workspace }}/build/app/outputs/flutter-apk/*.apk
