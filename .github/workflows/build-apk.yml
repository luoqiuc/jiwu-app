name: Build Jiwu APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate platform scaffold
        run: |
          cd /tmp
          flutter create --project-name jiwu_app --org com.example temp_project
          cp -r /tmp/temp_project/android $GITHUB_WORKSPACE/
          cp /tmp/temp_project/.gitignore $GITHUB_WORKSPACE/ 2>/dev/null || true

      - run: flutter pub get
        working-directory: ${{ github.workspace }}

      - name: Regenerate Android scaffold (force all plugin registrations)
        run: |
          # Remove old android scaffold completely so Flutter regenerates it
          rm -rf ${{ github.workspace }}/android
          cd /tmp && rm -rf temp_project
          flutter create --project-name jiwu_app --org com.example temp_project
          cp -r /tmp/temp_project/android $GITHUB_WORKSPACE/
          # Bump compileSdk on the actual app build.gradle.kts
          app_build="$GITHUB_WORKSPACE/android/app/build.gradle.kts"
          if grep -q 'compileSdk' "$app_build"; then
            sed -i 's/compileSdk.*=.*/compileSdk = 36/' "$app_build"
          fi
          # Also bump in any other gradle files
          find "$GITHUB_WORKSPACE/android" -name "build.gradle*" \
            -exec sed -i 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/g' {} +
          cat "$app_build" | grep compileSdk

      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64
        working-directory: ${{ github.workspace }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ github.workspace }}/build/app/outputs/flutter-apk/*.apk
